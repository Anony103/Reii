<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REII Automation</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap');

        .great-vibes {
            font-family: "Great Vibes", cursive;
        }

        .poppins {
            font-family: "Poppins", sans-serif;
        }
    </style>
</head>

<body class="bg-[#151515] flex justify-center p-4 poppins">

    <!-- Card Container -->
    <div class="w-[360px] bg-[#222] rounded-xl shadow-xl overflow-hidden text-white">

        <!-- Header Background -->
        <div class="relative h-40 bg-cover bg-center"
             style="background-image: url('https://via.placeholder.com/600x300');">

            <!-- Profile Image -->
            <img src="/images/reii.jpeg" alt="Profile Image"
                 class="absolute left-1/2 -bottom-16 transform -translate-x-1/2 w-32 h-32 rounded-full object-cover"/>
        </div>

        <!-- Content Section -->
        <div class="pt-20 px-6 pb-10 text-center">

            <h1 class="great-vibes text-3xl mb-1">PT REII Automation</h1>

            <p class="text-gray-300 text-sm mb-4">@REIIAUTOMATION</p>

            <p class="text-sm text-gray-200 mb-6 leading-relaxed">
                Empowering industries with AI-driven automation and sustainability
            </p>

            <!-- Buttons -->
            <a href="reiiautomation.com" class="block w-full border border-white py-3 rounded-full mb-3 hover:bg-white hover:text-black transition">
                OFFICIAL WEBSITE
            </a>

            <a href="https://www.youtube.com/@reiiautomation" class="block w-full border border-white py-3 rounded-full mb-3 hover:bg-white hover:text-black transition">
                YOUTUBE
            </a>

            <a href="https://www.linkedin.com/company/reiiautomation/" class="block w-full border border-white py-3 rounded-full mb-3 hover:bg-white hover:text-black transition">
                LINKEDIN
            </a>
        </div>

        <!-- Footer Logo -->
        <div class="flex justify-center pb-6">
            <img src="/images/Logo-7.webp" alt="Logo" class="opacity-80 w-20">
        </div>

    </div>

</body>
</html>
